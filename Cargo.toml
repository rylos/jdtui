[package]
name = "jdtui"
version = "0.1.0"
edition = "2024"

[lib]
name = "jdtui"
path = "src/lib.rs"

[[bin]]
name = "jdtui"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dirs = "6.0.0"
hmac = "0.13.0"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"
ureq = "3.4.0"
