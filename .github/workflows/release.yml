name: Release

# Builds the binaries for a tagged release and attaches them to it.
#
# Signing is deliberately not here: the private key never leaves the
# maintainer's machine. After this workflow finishes, run
# `scripts/sign-release.sh vX.Y.Z` locally to download what the runners
# built, sign it and upload the signatures.

on:
  push:
    tags: ["v*"]
  # So the build can be exercised without cutting a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload to (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The live tests are #[ignore]d: they need a My.JDownloader account.
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the Linux binaries are static and run on any
          # distribution whatever its glibc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: aarch64-linux
          - os: macos-13
            target: x86_64-apple-darwin
            asset: x86_64-macos
          - os: macos-14
            target: aarch64-apple-darwin
            asset: aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      # `ring`, under rustls, builds C code and needs a musl compiler.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="jdtui-${version}-${{ matrix.asset }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/jdtui.exe" dist/
            (cd dist && 7z a "${name}.zip" jdtui.exe >/dev/null && rm jdtui.exe)
          else
            cp "target/${{ matrix.target }}/release/jdtui" dist/
            strip dist/jdtui || true
            # The binary sits at the root of the archive, nothing else.
            (cd dist && tar czf "${name}.tar.gz" jdtui && rm jdtui)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "No tag to upload to; the binaries are in this run's artifacts."
            exit 0
          fi
          # The tag is annotated with the release notes, so a release this
          # workflow has to create can take them from there.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "jdtui ${TAG#v}" --notes-from-tag
          gh release upload "$TAG" dist/* --clobber
